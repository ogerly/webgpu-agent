<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webgpu-agent — KERN-Prototyp (Tokenwächter + Live-Gedächtnis)</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, sans-serif; }
      body { max-width: 820px; margin: 1.5rem auto; padding: 0 1rem; line-height: 1.5; }
      h1 { font-size: 1.3rem; margin-bottom: .25rem; }
      .panel { border: 1px solid #8884; border-radius: 8px; padding: .65rem .9rem; margin: .7rem 0; }
      .panel h2 { font-size: .98rem; margin: 0 0 .5rem; }
      .panel h3 { font-size: .82rem; margin: .7rem 0 .2rem; opacity: .8; }
      .toolbar { display: flex; gap: .5rem; flex-wrap: wrap; margin: .5rem 0; align-items: center; }
      button, label { padding: .4rem .75rem; }
      label { cursor: pointer; border: 1px solid #8884; border-radius: 6px; }
      .log { max-height: 200px; overflow-y: auto; font-family: ui-monospace, SFMono-Regular, monospace; font-size: .8rem; margin-top: .35rem; }
      .log .line { padding: .15rem 0; border-bottom: 1px solid #8882; }
      .log .flush { color: #b3541e; font-weight: 600; }
      .log .step { opacity: .9; }
      .badge { font-size: .72rem; opacity: .65; }
      small { opacity: .65; }
      #context { font-family: ui-monospace, monospace; font-size: .85rem; }
      .ctx-bar { height: 8px; background: #8882; border-radius: 4px; overflow: hidden; margin-top: .25rem; }
      .ctx-bar > span { display: block; height: 100%; width: 0; background: #4a90d9; transition: width .2s; }
    </style>
  </head>
  <body>
    <h1>🛰 webgpu-agent <span class="badge">local-first · WebGPU · AAMS-nativ</span></h1>
    <p class="badge">KERN-Prototyp (explorativ): mechanischer Loop + Tokenwächter · Live AAMS-Gedächtnis</p>

    <div id="app">
      <p id="session-id">…</p>

      <section class="panel">
        <h2>① KERN-Loop (mechanisch) + Tokenwächter</h2>
        <div class="toolbar">
          <button id="kern-start">▶ Loop starten</button>
          <button id="kern-stop">⏹ Loop stoppen</button>
        </div>
        <div id="context">Context: –</div>
        <div class="ctx-bar"><span id="ctx-fill"></span></div>
        <div id="kern-log" class="log"></div>
      </section>

      <section class="panel">
        <h2>② Session &amp; Tasks</h2>
        <div class="toolbar">
          <button id="plan">+ Aufgabe planen</button>
          <button id="run">▶ Schritt</button>
          <button id="export">⬇ JSON-Export</button>
          <label>⬆ Import<input type="file" id="import" accept="application/json,.json" hidden /></label>
        </div>
        <div id="tasks"></div>
      </section>

      <section class="panel">
        <h2>③ Live AAMS-Gedächtnis (AAMS-B)</h2>
        <h3>Memory (Gedächtnis)</h3>
        <div id="memory" class="log"></div>
        <h3>Audit-Log (Diary)</h3>
        <div id="audit" class="log"></div>
      </section>
    </div>

    <div id="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
